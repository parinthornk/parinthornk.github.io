* {

body {
    margin: 0;

}

.container {

}

h1 {
    color: #f5c542;
}

.search {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #444;
    border-radius: 8px;
    background: #202431;
    color: white;
    font-size: 16px;
}

.player {
    display: none;
    margin-bottom: 25px;
}

.player iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 10px;
    background: #000;
}

.episode-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
}

.episode {
    padding: 16px;
    border-radius: 8px;
    background: #202431;
    cursor: pointer;
    transition: background .2s;
}

.episode:hover {
    background: #343b4d;
}

.episode.active {
    border: 1px solid #f5c542;
}

.episode h3 {
    margin: 0 0 8px;
    font-size: 15px;
}

.episode a {
    color: #f5c542;
    font-size: 13px;
    text-decoration: none;
}

.count {
    color: #aaa;
    margin-bottom: 15px;
}

.navigation {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 15px 0;
}

.navigation button {
    padding: 12px 22px;
    border: none;
    border-radius: 7px;
    background: #f5c542;
    color: #10121a;
    font-weight: bold;
    cursor: pointer;
}

.navigation button:hover {
    background: #ffda70;
}

.navigation button:disabled {

}

#episodeNumber {

    font-size: 14px;
}

</style>
</head>

const container = document.getElementById("episodes");
const search = document.getElementById("search");
const player = document.getElementById("player");
const video = document.getElementById("video");

let currentEpisode = -1;

function renderEpisodes(filter = "") {
    container.innerHTML = "";

    const filtered = episodes.filter(ep =>
        ep.title.toLowerCase().includes(filter.toLowerCase())
    );

    document.getElementById("count").textContent =
        `${filtered.length} episodes available`;

    filtered.forEach(ep => {
        const index = episodes.indexOf(ep);
        const card = document.createElement("div");

        card.className = "episode";
        card.dataset.index = index;

        const title = document.createElement("h3");
        title.textContent = ep.title;

        const link = document.createElement("a");
        link.href = ep.url;
        link.target = "_blank";
        link.textContent = "Original episode page ↗";

        card.appendChild(title);
        card.appendChild(link);

        card.addEventListener("click", () => {
            playEpisode(index);
        });

        container.appendChild(card);
    });

    updateActiveEpisode();
}

function playEpisode(index) {
    if (index < 0 || index >= episodes.length) return;

    currentEpisode = index;

    const ep = episodes[index];

    document.getElementById("playerTitle").textContent = ep.title;
    document.getElementById("sourceLink").href = ep.url;

    document.getElementById("episodeNumber").textContent =
        `Episode ${index + 1} / ${episodes.length}`;

    video.src = ep.stream_url;

    player.style.display = "block";

    updateActiveEpisode();
    updateNavigation();

    /*player.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });*/
}

function changeEpisode(direction) {
    const nextIndex = currentEpisode + direction;

    if (nextIndex < 0 || nextIndex >= episodes.length) return;

    playEpisode(nextIndex);
}

function updateNavigation() {
    document.getElementById("prevBtn").disabled =
        currentEpisode <= 0;

    document.getElementById("nextBtn").disabled =
        currentEpisode >= episodes.length - 1;
}

function updateActiveEpisode() {
    document.querySelectorAll(".episode").forEach(card => {
        card.classList.toggle(
            "active",
            Number(card.dataset.index) === currentEpisode
        );
    });
}

search.addEventListener("input", e => {
    renderEpisodes(e.target.value);
});

renderEpisodes();

</script>
